name: VPN CI

on:
  push:
    branches: [ "master", "develop" ] 
  pull_request:
    branches: [ "master" ]         

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-packages

      - name: Run tests
        run: uv run pytest